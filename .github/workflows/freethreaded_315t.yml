name: free-threaded 3.15t

# Builds the full PyMuPDF wheel (core + layout + pymupdf4llm) and onnxruntime for CPython 3.15t,
# then runs freethreaded/verify against the official PyMuPDF 2.1 wheel. See freethreaded/README.md.

on:
  push:
    branches: [python-3.15t]
    paths: ['src/**', 'setup.py', 'freethreaded/**', '.github/workflows/freethreaded_315t.yml']
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: 'Soak test length in minutes'
        default: '180'

env:
  PBS_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.15.2%2B20261026-x86_64-unknown-linux-gnu-freethreaded-install_only.tar.gz
  PBS_SHA256: 8da464230c40e9026e2a5abfdef34454d580b839f922f1f0add8fd2f06d98181
  ORT_COMMIT: 6af1a932e2286d5c58166085d24c68783033edee

jobs:
  onnxruntime:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ort-dist
          key: ort-cp315t-${{ env.ORT_COMMIT }}-${{ hashFiles('freethreaded/patches/onnxruntime-*', 'freethreaded/scripts/build_onnxruntime.sh') }}
      - name: Python 3.15t
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o pbs.tgz "$PBS_URL" && echo "$PBS_SHA256  pbs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/py315t" && tar xzf pbs.tgz -C "$RUNNER_TEMP/py315t"
      - name: Build onnxruntime
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          freethreaded/scripts/build_onnxruntime.sh "$RUNNER_TEMP/py315t/python/bin/python3.15t" "$RUNNER_TEMP/work-ort" "$(nproc)"
          mkdir -p ort-dist && cp "$RUNNER_TEMP"/work-ort/build/Release/dist/*.whl ort-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-cp315t
          path: ort-dist/*.whl

  pymupdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        variant: [base, atomic]   # atomic: + patches/mupdf-0002-atomic-refcounts.patch
    env:
      PYMUPDF_FT_ATOMIC_REFCOUNTS: ${{ matrix.variant == 'atomic' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.15t
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pbs.tgz" "$PBS_URL" && echo "$PBS_SHA256  $RUNNER_TEMP/pbs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/py315t" && tar xzf "$RUNNER_TEMP/pbs.tgz" -C "$RUNNER_TEMP/py315t"
      - name: Build PyMuPDF
        run: freethreaded/scripts/build_pymupdf.sh "$RUNNER_TEMP/py315t/python/bin/python3.15t" "$RUNNER_TEMP/work"
      - uses: actions/upload-artifact@v4
        with:
          name: pymupdf-cp315t-${{ matrix.variant }}
          path: ${{ runner.temp }}/work/dist/*.whl

  verify:
    needs: [onnxruntime, pymupdf]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [base, atomic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: onnxruntime-cp315t
          path: wheels
      - uses: actions/download-artifact@v4
        with:
          name: pymupdf-cp315t-${{ matrix.variant }}
          path: wheels
      - name: Real-world test PDFs
        id: docs
        uses: actions/cache@v4
        with:
          path: docs
          key: testdocs-${{ hashFiles('freethreaded/testdocs/manifest.json') }}
      - name: Fetch test PDFs
        run: python3 -I freethreaded/verify/fetch_docs.py freethreaded/testdocs/manifest.json docs
      - name: Fonts for the generated corpus
        run: |
          sudo apt-get update -q && sudo apt-get install -yq fonts-dejavu-core fonts-liberation fonts-crosextra-carlito fonts-wqy-zenhei
      # PyPI has no onnxruntime for 3.15, so the reference side is the official wheel on 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Environments
        run: |
          python -m venv "$RUNNER_TEMP/official"
          "$RUNNER_TEMP/official/bin/pip" install -q pymupdf==2.1 onnxruntime==1.31.1 numpy pyyaml networkx psutil tabulate
          curl -fsSL -o "$RUNNER_TEMP/pbs.tgz" "$PBS_URL" && echo "$PBS_SHA256  $RUNNER_TEMP/pbs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/py315t" && tar xzf "$RUNNER_TEMP/pbs.tgz" -C "$RUNNER_TEMP/py315t"
          "$RUNNER_TEMP/py315t/python/bin/python3.15t" -m venv "$RUNNER_TEMP/ours"
          "$RUNNER_TEMP/ours/bin/pip" install -q --find-links wheels wheels/pymupdf-*.whl psutil tabulate
          "$RUNNER_TEMP/ours/bin/pip" list
      - name: Verify
        shell: bash
        run: freethreaded/verify/run_all.sh "$RUNNER_TEMP/official/bin/python" "$RUNNER_TEMP/ours/bin/python" "$RUNNER_TEMP/verify-work" "$PWD/docs" 2>&1 | tee verify.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log-${{ matrix.variant }}
          path: verify.txt

  profile:
    needs: [onnxruntime, pymupdf]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [base, atomic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: onnxruntime-cp315t
          path: wheels
      - uses: actions/download-artifact@v4
        with:
          name: pymupdf-cp315t-${{ matrix.variant }}
          path: wheels
      - name: Real-world test PDFs
        id: docs2
        uses: actions/cache@v4
        with:
          path: docs
          key: testdocs-${{ hashFiles('freethreaded/testdocs/manifest.json') }}
      - name: Fetch test PDFs
        run: python3 -I freethreaded/verify/fetch_docs.py freethreaded/testdocs/manifest.json docs
      - name: Environment
        run: |
          sudo apt-get update -q && sudo apt-get install -yq fonts-dejavu-core fonts-liberation fonts-crosextra-carlito fonts-wqy-zenhei
          sudo apt-get install -yq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -yq linux-tools-azure || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true
          curl -fsSL -o "$RUNNER_TEMP/pbs.tgz" "$PBS_URL" && echo "$PBS_SHA256  $RUNNER_TEMP/pbs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/py315t" && tar xzf "$RUNNER_TEMP/pbs.tgz" -C "$RUNNER_TEMP/py315t"
          "$RUNNER_TEMP/py315t/python/bin/python3.15t" -m venv "$RUNNER_TEMP/ours"
          "$RUNNER_TEMP/ours/bin/pip" install -q --find-links wheels wheels/pymupdf-*.whl psutil tabulate
          lscpu | grep -E "^CPU\(s\)|Thread|Core|Model name"
      - name: Profile
        shell: bash
        run: |
          set -x
          PY="$RUNNER_TEMP/ours/bin/python"; V="$PWD/freethreaded/verify"; mkdir -p prof && cd prof
          "$PY" -I "$V/gen_corpus.py" corpus 0 24
          export PYTHONPATH="$V"
          "$PY" "$V/profile_md.py" corpus 24 1,2,4 default.json 2>&1 | tee -a ../profile.txt
          PYMUPDF_LAYOUT_ORT_THREADS=0 "$PY" "$V/profile_md.py" corpus 24 1,2,4 ort_default.json 2>&1 | tee -a ../profile.txt
          PYMUPDF_LAYOUT_PER_THREAD=0 "$PY" "$V/profile_md.py" corpus 24 1,4 shared_model.json 2>&1 | tee -a ../profile.txt
          PROFILE_GC=off "$PY" "$V/profile_md.py" corpus 24 1,2,4 gc_off.json 2>&1 | tee -a ../profile.txt
          MUPDF_indep_ctx=1 "$PY" "$V/profile_md.py" corpus 24 1,2,4 indep.json 2>&1 | tee -a ../profile.txt
          for indep in 0 1; do MUPDF_indep_ctx=$indep "$PY" "$V/stress_render.py" corpus 1,2,4 2 2>&1 | tee -a ../profile.txt; done
          echo "## real-world PDFs, first 6 pages each" | tee -a ../profile.txt
          MAX_PAGES=6 "$PY" "$V/profile_md.py" ../docs 45 1,2,4 docs_default.json 2>&1 | tee -a ../profile.txt
          MAX_PAGES=6 PYMUPDF_LAYOUT_ORT_THREADS=0 "$PY" "$V/profile_md.py" ../docs 45 1,4 docs_ort_default.json 2>&1 | tee -a ../profile.txt
          MAX_PAGES=6 PROFILE_GC=off "$PY" "$V/profile_md.py" ../docs 45 1,4 docs_gc_off.json 2>&1 | tee -a ../profile.txt
          for indep in 0 1; do MAX_PAGES=4 MUPDF_indep_ctx=$indep "$PY" "$V/stress_render.py" ../docs 1,2,4 1 2>&1 | tee -a ../profile.txt; done
      - name: Sampling profiler (wall clock, all threads)
        continue-on-error: true
        shell: bash
        run: |
          PY="$RUNNER_TEMP/ours/bin/python"; V="$PWD/freethreaded/verify"; cd prof; export PYTHONPATH="$V"
          "$PY" -m profiling.sampling run --help | head -60 || true
          MAX_PAGES=6 "$PY" -m profiling.sampling run -a --mode wall --collapsed -o ../sampling_wall.txt "$V/profile_md.py" ../docs 24 4 || true
          "$PY" -I - ../sampling_wall.txt <<'PYEOF' | tee ../sampling_summary.txt
          import collections, sys
          leaf, incl, total = collections.Counter(), collections.Counter(), 0
          for line in open(sys.argv[1]):
              stack, _, n = line.rstrip().rpartition(" ")
              if not n.isdigit():
                  continue
              n = int(n); total += n; frames = stack.split(";")
              leaf[frames[-1]] += n
              for f in set(frames):
                  incl[f] += n
          print(f"samples={total}")
          print("== leaf frames (where threads are)")
          for f, n in leaf.most_common(40):
              print(f"{n / total:6.1%}  {f}")
          print("== inclusive")
          for f, n in incl.most_common(60):
              print(f"{n / total:6.1%}  {f}")
          PYEOF
      - name: perf
        continue-on-error: true
        shell: bash
        run: |
          PY="$RUNNER_TEMP/ours/bin/python"; V="$PWD/freethreaded/verify"; cd prof; export PYTHONPATH="$V"
          for indep in 0 1; do
            MUPDF_indep_ctx=$indep perf record -q -F 499 -g -o oncpu$indep.data -- "$PY" -X perf "$V/profile_md.py" corpus 16 4 >/dev/null 2>&1
            perf report -i oncpu$indep.data --no-children --sort dso,sym --stdio 2>/dev/null | grep -v "^$" | head -80 > ../perf_oncpu_indep$indep.txt
            MUPDF_indep_ctx=$indep perf record -q -e sched:sched_switch -g -o offcpu$indep.data -- "$PY" "$V/profile_md.py" corpus 16 4 >/dev/null 2>&1
            perf report -i offcpu$indep.data --no-children --sort sym --stdio -G 2>/dev/null | grep -v "^$" | head -200 > ../perf_offcpu_indep$indep.txt
          done
          # Rendering + text (stress_render), default vs independent contexts: on-CPU by symbol,
          # and where threads block (sched_switch call graphs: locks show as futex waits).
          for indep in 0 1; do
            MUPDF_indep_ctx=$indep perf record -q -F 999 -g -o r_on$indep.data -- "$PY" "$V/stress_render.py" corpus 4 1 >/dev/null 2>&1
            perf report -i r_on$indep.data --no-children --sort dso,sym --stdio -g none 2>/dev/null | grep -v "^$" | grep -v "^#" | head -60 > ../perf_render_oncpu_indep$indep.txt
            MUPDF_indep_ctx=$indep perf record -q -e sched:sched_switch -g -o r_off$indep.data -- "$PY" "$V/stress_render.py" corpus 4 1 >/dev/null 2>&1
            perf report -i r_off$indep.data --no-children --sort sym --stdio -G 2>/dev/null | grep -v "^$" | head -250 > ../perf_render_offcpu_indep$indep.txt
          done
          # onnxruntime threads per process during to_markdown at 4 threads (expect none beyond the 4 workers)
          ( "$PY" "$V/profile_md.py" corpus 8 4 >/dev/null 2>&1 & P=$!; sleep 25; ps -T -p $P -o tid,comm,pcpu | sort -k3 -rn | head -40; wait $P ) > ../threads_md.txt 2>&1
          ls -l ../perf_*.txt ../threads_md.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-${{ matrix.variant }}
          path: |
            profile.txt
            perf_*.txt
            threads_md.txt
            sampling_*.txt
            prof/*.json

  soak:
    # Long run of the mixed workload on real PDFs; fails on a wrong result or on memory that
    # keeps growing (RSS slope over the second half). 60 minutes on push.
    needs: [onnxruntime, pymupdf]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SOAK_MINUTES: ${{ inputs.soak_minutes || '60' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: onnxruntime-cp315t
          path: wheels
      - uses: actions/download-artifact@v4
        with:
          name: pymupdf-cp315t-base
          path: wheels
      - name: Real-world test PDFs
        uses: actions/cache@v4
        with:
          path: docs
          key: testdocs-${{ hashFiles('freethreaded/testdocs/manifest.json') }}
      - name: Fetch test PDFs
        run: python3 -I freethreaded/verify/fetch_docs.py freethreaded/testdocs/manifest.json docs
      - name: Environment
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pbs.tgz" "$PBS_URL" && echo "$PBS_SHA256  $RUNNER_TEMP/pbs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/py315t" && tar xzf "$RUNNER_TEMP/pbs.tgz" -C "$RUNNER_TEMP/py315t"
          "$RUNNER_TEMP/py315t/python/bin/python3.15t" -m venv "$RUNNER_TEMP/ours"
          "$RUNNER_TEMP/ours/bin/pip" install -q --find-links wheels wheels/pymupdf-*.whl psutil
      - name: Soak (${{ env.SOAK_MINUTES }} minutes, 4 threads)
        shell: bash   # -o pipefail: a failing soak must fail the step despite tee
        run: |
          cd "$RUNNER_TEMP" && PYTHONPATH="$GITHUB_WORKSPACE/freethreaded/verify" MAX_PAGES=4 \
            "$RUNNER_TEMP/ours/bin/python" "$GITHUB_WORKSPACE/freethreaded/verify/soak.py" "$GITHUB_WORKSPACE/docs" 4 "$SOAK_MINUTES" "$GITHUB_WORKSPACE/soak.csv" 2>&1 | tee "$GITHUB_WORKSPACE/soak.txt"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak
          path: |
            soak.txt
            soak.csv
